name: Agendum Action
description: 把经过验证的高价值信号变成一个能在 1 分钟内决定、可执行、可复盘的行动。
title: "[TYPE] YYYY-MM-DD · 一句话决策 / 行动"
labels:
  - action
body:
  - type: markdown
    attributes:
      value: |
        **Decision first.** 顺序 = 决定 → 信任 → 理解 → 行动 → 复盘。
        普通新闻、普通 Trending、重复信号不要建 Issue；缺任何必填项就改为 WATCH 或不提交。

  # ---------- 1. 决定（Decide） ----------
  - type: dropdown
    id: action-type
    attributes:
      label: 事件类型
      options: [READ, RESEARCH, EXPERIMENT, BUILD, WRITE, POST, UPDATE, DOMAIN, BUY, WATCH]
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: P0 今天 / P1 本周 / P2 backlog / WATCH 暂不行动（类型为 WATCH 时选 WATCH）。
      options: [P0, P1, P2, WATCH]
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: 工作量
      options:
        - XS · 30 分钟以内
        - S · 1–2 小时
        - M · 半天～1 天
        - L · 超过 1 天
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: 核心判断
      description: 一句话"所以呢"：值不值得、做什么、为什么现在。不是新闻摘要。
      placeholder: 值得花 2 小时实测 X，因为它直接回答我在 Harness 研究里的 Y 问题。
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: 为什么推荐 / 为什么值得
      description: 推荐理由 + 投入产出（花多少时间/钱，换来什么，不做的代价）+ 与 GeekJourney 项目/研究的具体关联。
      placeholder: |
        - 推荐理由：
        - 投入：约 X 小时 / $Y
        - 回报：
        - 不做的代价 / 时效性：
        - 关联项目：hnews-radar / Agent Harness / ...
    validations:
      required: true

  # ---------- 2. 信任（Trust） ----------
  - type: textarea
    id: evidence
    attributes:
      label: 证据链
      description: 每条带链接和发布时间（北京时间）。宣称但未核实的数字必须标注"未核实"。
      value: |
        - **一手来源**：
        - **发布时间**：
        - **独立验证**：
        - **相关讨论**（HN / X / GitHub）：
        - **局限 / 反证 / 未核实**：
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: 发现渠道
      description: 例如 HN / AIHot / X / Gmail·Newsletter / GitHub / Wisereads / 阮一峰周刊（发现于哪，不等于一手来源）。
    validations:
      required: true

  # ---------- 3. 理解（Understand） ----------
  - type: textarea
    id: understanding
    attributes:
      label: 解读与拆解
      description: 发生了什么、背景、为什么现在出现；再拆核心机制 / 关键数字 / 可复用的点。
      value: |
        **解读**：

        **拆解**：
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 总结
      description: 3 句以内，让没读上面内容的人也能复述。
    validations:
      required: true

  # ---------- 4. 行动（Act） ----------
  - type: textarea
    id: next-action
    attributes:
      label: 下一步
      description: 具体可执行，禁止"继续关注""有空研究"。
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 预期结果与完成标准
      description: 做完得到什么产物；满足什么条件可关闭。
      value: |
        - **预期产物**：
        - **完成标准**：
    validations:
      required: true

  # ---------- 5. 复盘（Learn） ----------
  - type: textarea
    id: progress
    attributes:
      label: 进度记录
      description: 当前状态以最后一行为准（TODO / DOING / BLOCKED / DONE / WATCHING / DROPPED）。
      value: |
        | 日期 | 状态 | 进展 |
        | --- | --- | --- |
        | YYYY-MM-DD | TODO | Issue 创建 |
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 结果 / 复盘
      description: 做了什么、得到什么、学到什么；失败也要写。
    validations:
      required: false

  - type: dropdown
    id: follow-up
    attributes:
      label: 后续决策
      options:
        - KEEP · 继续
        - DOUBLE DOWN · 加大投入
        - FOLLOW-UP · 创建后续 Action
        - WATCH · 转入观察
        - DROP · 放弃
    validations:
      required: false
