name: Agendum Action
description: 把经过验证的高价值信号转化为一个可执行、可追踪的行动。
title: "[ACTION] "
labels:
  - action
body:
  - type: markdown
    attributes:
      value: |
        # Signal → Evidence → Decision → Action

        只有具备明确判断和下一步动作的高价值信号才应创建 Issue。避免把普通新闻、收藏或灵感直接变成任务。

  - type: input
    id: date
    attributes:
      label: 日期
      description: 事件发生或被发现的日期，使用 YYYY-MM-DD。
      placeholder: 2026-10-16
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 来源
      description: 主要信号来源。
      options:
        - HN
        - AIHot
        - X
        - Gmail / Newsletter
        - Outlook / Newsletter
        - GitHub
        - Wisereads
        - 阮一峰周刊
        - 创意小项目
        - Other
    validations:
      required: true

  - type: dropdown
    id: action-type
    attributes:
      label: 事件类型
      description: 选择最终要执行的动作。
      options:
        - READ
        - RESEARCH
        - EXPERIMENT
        - BUILD
        - WRITE
        - POST
        - UPDATE
        - DOMAIN
        - BUY
        - WATCH
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: P0 今天处理，P1 本周处理，P2 进入 backlog。
      options:
        - P0
        - P1
        - P2
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 进度状态
      options:
        - TODO
        - DOING
        - BLOCKED
        - DONE
        - WATCHING
        - DROPPED
    validations:
      required: true

  - type: textarea
    id: event
    attributes:
      label: 事件描述
      description: 说明发生了什么，以及为什么值得进入 Agendum。
      placeholder: |
        发生了什么？
        为什么值得关注？
    validations:
      required: true

  - type: textarea
    id: decision
    attributes:
      label: 核心判断
      description: 用一句话说明最终判断，避免写成新闻摘要。
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: 提供一手来源和独立验证，确保结论可回溯。
      placeholder: |
        ### 一手来源
        - 

        ### 独立验证
        - 
    validations:
      required: true

  - type: textarea
    id: relevance
    attributes:
      label: Why it matters to GeekJourney
      description: 说明与我的项目、研究、内容、产品或个人品牌的具体关系。
    validations:
      required: true

  - type: textarea
    id: next-action
    attributes:
      label: 下一步
      description: 必须是具体可执行动作，避免“继续关注”“有空研究一下”。
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 完成这个 Action 后应该得到什么？
    validations:
      required: true

  - type: dropdown
    id: effort
    attributes:
      label: 工作量
      options:
        - XS · 30 分钟以内
        - S · 1–2 小时
        - M · 半天～1 天
        - L · 超过 1 天
    validations:
      required: true

  - type: textarea
    id: progress
    attributes:
      label: 进度记录
      description: 每次推进都追加一行，保留日期、状态和进展。
      value: |
        | 日期 | 状态 | 进展 |
        | --- | --- | --- |
        | YYYY-MM-DD | TODO | Issue 创建 |
    validations:
      required: true

  - type: textarea
    id: completion
    attributes:
      label: 完成标准
      description: 明确什么条件满足后可以关闭 Issue。
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: result
    attributes:
      label: 结果 / 复盘
      description: 完成后填写做了什么、得到什么、是否值得继续。
    validations:
      required: false

  - type: dropdown
    id: follow-up
    attributes:
      label: 后续决策
      options:
        - KEEP · 继续
        - DOUBLE DOWN · 加大投入
        - FOLLOW-UP · 创建后续 Action
        - WATCH · 转入观察
        - DROP · 放弃
    validations:
      required: false